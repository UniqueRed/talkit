<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --sidebar: #efede8;
    --line: #e2dfd8;
    --text: #1d1c1a;
    --muted: #77736b;
    --faint: #a7a298;
    --hover: rgba(0,0,0,.045);
    --selected: rgba(0,0,0,.075);
    --accent: #2f6fde;
    --green: #1f9d5b;
    --red: #e0453a;
    --orange: #e08a1e;
    --blue: #2f6fde;
    --shadow: 0 8px 30px rgba(0,0,0,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1d;
      --panel: #222225;
      --sidebar: #19191b;
      --line: #313135;
      --text: #ecebe8;
      --muted: #9a978f;
      --faint: #6a6863;
      --hover: rgba(255,255,255,.05);
      --selected: rgba(255,255,255,.09);
      --accent: #6ea0ff;
      --green: #3ec27a;
      --red: #ff6b5f;
      --orange: #f5a23c;
      --blue: #6ea0ff;
      --shadow: 0 8px 30px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text); background: var(--bg);
    display: grid; grid-template-columns: 260px 1fr; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--sidebar); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; }
  .brand h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 550; padding: 3px 9px 3px 8px; border-radius: 99px;
    background: var(--hover); color: var(--muted);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill[data-s="ready"] .dot { background: var(--muted); }
  .pill[data-s="listening"] { color: var(--green); } .pill[data-s="listening"] .dot { background: var(--green); animation: pulse 1.6s infinite; }
  .pill[data-s="recording"] { color: var(--red); } .pill[data-s="recording"] .dot { background: var(--red); animation: pulse 1s infinite; }
  .pill[data-s="handsfree"] { color: var(--orange); } .pill[data-s="handsfree"] .dot { background: var(--orange); animation: pulse 1s infinite; }
  .pill[data-s="transcribing"] { color: var(--blue); } .pill[data-s="transcribing"] .dot { background: var(--blue); animation: pulse .7s infinite; }
  .pill[data-s="loading"] .dot { animation: pulse 1s infinite; }
  .pill[data-s="error"] { color: var(--red); } .pill[data-s="error"] .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }

  .control { padding: 4px 12px 12px; }
  .big {
    width: 100%; border: 0; border-radius: 10px; padding: 11px 12px; cursor: pointer;
    font-weight: 600; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--text); color: var(--bg); transition: transform .06s, opacity .15s;
  }
  .big:active { transform: scale(.985); }
  .big:disabled { opacity: .4; cursor: default; }
  .big.on { background: var(--red); color: #fff; }
  .big svg { width: 14px; height: 14px; }
  .meter { display: flex; align-items: center; gap: 2px; height: 26px; margin-top: 10px; padding: 0 2px; }
  .meter span { flex: 1; border-radius: 2px; background: var(--faint); opacity: .35; height: 3px; transition: height .08s; }
  .meter.live span { opacity: .9; background: var(--green); }
  .meter.rec span { opacity: .9; background: var(--red); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-align: center; min-height: 17px; }

  .toggle { display: flex; align-items: center; justify-content: space-between; margin: 0 12px 6px; padding: 8px 10px; border-radius: 8px; }
  .toggle:hover { background: var(--hover); }
  .toggle label { cursor: pointer; }
  .toggle small { display: block; color: var(--muted); font-size: 11px; }
  .switch { position: relative; width: 32px; height: 19px; flex: none; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + i { background: var(--green); }
  .switch input:checked + i::after { transform: translateX(13px); }

  nav { padding: 6px 8px; overflow-y: auto; flex: 1; min-height: 0; }
  .section { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 12px 8px 5px; display: flex; justify-content: space-between; }
  .section button { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 11px; text-transform: none; letter-spacing: 0; padding: 0; }
  .section button:hover { color: var(--text); }
  .item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
  }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--selected); }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .count { color: var(--faint); font-size: 11.5px; }
  .item .live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.6s infinite; flex: none; }
  .item svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .empty-side { color: var(--faint); padding: 4px 8px; font-size: 12px; }
  .foot { border-top: 1px solid var(--line); padding: 10px 16px; font-size: 11.5px; color: var(--muted); }
  kbd { font: 11px ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line);
  }
  header .titles { flex: 1; min-width: 0; }
  header h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .meta { color: var(--muted); font-size: 12px; }
  .search {
    width: 180px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 7px; padding: 5px 9px; font: inherit; outline: none; -webkit-user-select: text; user-select: text;
  }
  .search:focus { border-color: var(--accent); }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .4; cursor: default; background: var(--panel); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn svg { width: 13px; height: 13px; }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 5px;
    display: none;
  }
  .menu.open { display: block; }
  .menu button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--accent); color: #fff; }
  .menu button span { color: var(--faint); font-size: 11.5px; }
  .menu button:hover span { color: rgba(255,255,255,.8); }

  .content { flex: 1; overflow-y: auto; padding: 8px 0 24px; -webkit-user-select: text; user-select: text; }
  .row { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; padding: 8px 18px; align-items: baseline; }
  .row:hover { background: var(--hover); }
  .row .t { color: var(--faint); font-size: 11.5px; padding-top: 1px; }
  .row .x { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .row .x .app { display: inline-block; font-size: 11px; color: var(--muted); background: var(--hover); padding: 0 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
  .row .x .raw { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .row .acts { opacity: 0; transition: opacity .1s; }
  .row:hover .acts { opacity: 1; }
  .icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 4px; }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .icon-btn svg { width: 13px; height: 13px; display: block; }
  mark { background: rgba(255, 200, 0, .35); color: inherit; border-radius: 2px; }
  .pending { color: var(--muted); font-style: italic; }
  .pending .x { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .wave { display: inline-flex; gap: 2px; align-items: center; height: 12px; }
  .wave i { width: 3px; height: 4px; background: var(--green); border-radius: 2px; animation: wv 0.9s infinite ease-in-out; }
  .wave i:nth-child(2) { animation-delay: .15s } .wave i:nth-child(3) { animation-delay: .3s }
  .wave.blue i { background: var(--blue); }
  @keyframes wv { 50% { height: 12px; } }

  .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 40px; }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .empty p { margin: 2px 0; max-width: 380px; }

  .log { font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; padding: 10px 18px; }
  .log div { white-space: pre-wrap; word-break: break-word; }
  .log .lt { color: var(--faint); margin-right: 10px; }
  .log .err { color: var(--red); }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(calc(-50% + 130px), 20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow);
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: 60vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(calc(-50% + 130px), 0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>Flow</h1>
    <span class="pill" id="pill" data-s="loading"><span class="dot"></span><span id="pillText">Loading model…</span></span>
  </div>

  <div class="control">
    <button class="big" id="listenBtn" disabled>
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 8 1Z"/><path d="M3.5 7a.75.75 0 0 1 .75.75 3.75 3.75 0 0 0 7.5 0 .75.75 0 0 1 1.5 0 5.25 5.25 0 0 1-4.5 5.2V14.5a.75.75 0 0 1-1.5 0v-1.55a5.25 5.25 0 0 1-4.5-5.2A.75.75 0 0 1 3.5 7Z"/></svg>
      <span id="listenLabel">Start transcript</span>
    </button>
    <div class="meter" id="meter"></div>
    <div class="hint" id="hint">Loading the Whisper model…</div>
  </div>

  <div class="toggle">
    <label for="cleanup">AI cleanup<small>Polish dictation with Claude</small></label>
    <span class="switch"><input type="checkbox" id="cleanup"><i></i></span>
  </div>

  <nav>
    <div class="section">Library</div>
    <button class="item" data-view="dictations">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>
      <span class="name">Dictations</span><span class="count" id="dictCount"></span>
    </button>
    <button class="item" data-view="activity">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>
      <span class="name">Activity</span>
    </button>
    <div class="section">Transcripts <button id="openFolder" title="Open folder in Finder">Open folder</button></div>
    <div id="sessions"></div>
  </nav>

  <div class="foot">Hold <kbd>Right ⌥</kbd> to dictate anywhere · double-tap for hands-free · <kbd>esc</kbd> cancels</div>
</aside>

<main>
  <header>
    <div class="titles">
      <h2 id="title">Flow</h2>
      <div class="meta" id="meta"></div>
    </div>
    <input class="search" id="search" placeholder="Search" type="search">
    <button class="btn" id="copyBtn" title="Copy all text">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5H5"/></svg>Copy
    </button>
    <button class="btn" id="revealBtn" title="Show file in Finder">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.75 4.25A1.5 1.5 0 0 1 3.25 2.75h3l1.5 1.5h5a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-9.5a1.5 1.5 0 0 1-1.5-1.5Z"/></svg>Reveal
    </button>
    <div class="menu-wrap">
      <button class="btn primary" id="exportBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8.5M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>Export
      </button>
      <div class="menu" id="exportMenu"></div>
    </div>
  </header>
  <div class="content" id="content"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => window.webkit?.messageHandlers?.flow?.postMessage(JSON.stringify(msg));
window.onerror = (msg, src, line, col) => { post({ cmd: "jsError", msg: `${msg} (line ${line}:${col})` }); };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5H5"/></svg>';
const SESSION_FORMATS = [["md","Markdown",".md"],["txt","Plain text",".txt"],["srt","Subtitles",".srt"],["json","JSON",".json"]];
const DICTATION_FORMATS = [["md","Markdown",".md"],["txt","Plain text",".txt"],["json","JSON",".json"]];
const STATUS_TEXT = { loading:"Loading model…", ready:"Ready", listening:"Listening", recording:"Recording", handsfree:"Hands-free", transcribing:"Transcribing", error:"Error" };

const S = {
  view: "dictations",      // "session" | "dictations" | "activity"
  sessionId: null,
  sessions: [],
  entries: [],             // entries of the selected session
  dictations: [],          // newest first
  logs: [],
  state: { status: "loading", ready: false, continuous: false, cleanup: false, liveSession: null, pending: 0 },
  speaking: false,
  query: "",
};

// ---------- level meter ----------
const BARS = 36, levels = new Array(BARS).fill(0);
$("meter").innerHTML = "<span></span>".repeat(BARS);
const bars = [...$("meter").children];
function pushLevel(v) {
  levels.shift(); levels.push(v);
  bars.forEach((b, i) => b.style.height = (3 + levels[i] * 23) + "px");
}

// ---------- rendering ----------
function renderStatus() {
  const st = S.state;
  $("pill").dataset.s = st.status;
  $("pillText").textContent = st.error ? st.error : STATUS_TEXT[st.status] || st.status;
  const b = $("listenBtn");
  b.disabled = !st.ready;
  b.classList.toggle("on", st.continuous);
  $("listenLabel").textContent = st.continuous ? "Stop transcript" : "Start transcript";
  $("meter").className = "meter" + (st.continuous ? " live" : "") + (st.status === "recording" || st.status === "handsfree" ? " rec" : "");
  $("cleanup").checked = !!st.cleanup;
  let hint = "";
  if (!st.ready) hint = st.error ? "" : "Loading the Whisper model…";
  else if (st.status === "recording") hint = "Recording dictation — release to paste";
  else if (st.status === "handsfree") hint = "Hands-free — tap Right ⌥ to finish";
  else if (st.continuous) hint = S.speaking ? "Hearing speech…" : "Listening — just talk";
  else hint = "Transcribe a meeting or conversation";
  $("hint").textContent = hint;
}

function renderSidebar() {
  document.querySelectorAll(".item[data-view]").forEach(el =>
    el.classList.toggle("sel", S.view === el.dataset.view));
  $("dictCount").textContent = S.dictations.length || "";
  const live = S.state.liveSession;
  $("sessions").innerHTML = S.sessions.length ? S.sessions.map(s => `
    <button class="item ${S.view === "session" && S.sessionId === s.id ? "sel" : ""}" data-session="${esc(s.id)}">
      ${s.id === live ? '<span class="live" title="Recording now"></span>' : '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.75h5.5L12.5 4.75v9.5H4Z"/><path d="M6 8h4.5M6 10.75h4.5"/></svg>'}
      <span class="name">${esc(s.title)}</span><span class="count">${s.count || ""}</span>
    </button>`).join("") : '<div class="empty-side">No transcripts yet</div>';
}

function highlight(text) {
  const t = esc(text);
  if (!S.query) return t;
  const q = S.query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
}
const matches = (text) => !S.query || text.toLowerCase().includes(S.query.toLowerCase());
const words = (list) => list.reduce((n, e) => n + e.text.split(/\s+/).filter(Boolean).length, 0);

function renderHeader() {
  const exportable = S.view !== "activity";
  ["copyBtn", "exportBtn", "search"].forEach(id => $(id).classList.toggle("hidden", !exportable));
  $("revealBtn").classList.toggle("hidden", S.view !== "session");
  if (S.view === "session") {
    const s = S.sessions.find(x => x.id === S.sessionId);
    $("title").textContent = s ? s.title : "Transcript";
    const live = S.sessionId === S.state.liveSession;
    $("meta").textContent = `${S.entries.length} entr${S.entries.length === 1 ? "y" : "ies"} · ${words(S.entries).toLocaleString()} words` + (live ? " · live" : "");
    $("copyBtn").disabled = $("exportBtn").disabled = !S.entries.length;
  } else if (S.view === "dictations") {
    $("title").textContent = "Dictations";
    $("meta").textContent = `${S.dictations.length} dictation${S.dictations.length === 1 ? "" : "s"} · ${words(S.dictations).toLocaleString()} words`;
    $("copyBtn").disabled = $("exportBtn").disabled = !S.dictations.length;
  } else {
    $("title").textContent = "Activity";
    $("meta").textContent = "What Flow is doing behind the scenes";
  }
  const fmts = S.view === "dictations" ? DICTATION_FORMATS : SESSION_FORMATS;
  $("exportMenu").innerHTML = fmts.map(([f, label, ext]) => `<button data-format="${f}">${label}<span>${ext}</span></button>`).join("");
}

function sessionRow(e) {
  return `<div class="row"><span class="t mono">${esc(e.time)}</span><span class="x">${highlight(e.text)}</span>
    <span class="acts"><button class="icon-btn" title="Copy" data-copy="${esc(e.text)}">${ICON_COPY}</button></span></div>`;
}
function pendingRow() {
  const live = S.view === "session" && S.sessionId === S.state.liveSession && S.state.continuous;
  if (!live) return "";
  if (S.speaking) return `<div class="row pending" id="pending"><span class="t"></span><span class="x"><span class="wave"><i></i><i></i><i></i></span>Hearing speech…</span><span></span></div>`;
  if (S.state.pending > 0) return `<div class="row pending" id="pending"><span class="t"></span><span class="x"><span class="wave blue"><i></i><i></i><i></i></span>Transcribing…</span><span></span></div>`;
  return "";
}
function fmtTime(ts) {
  const d = new Date(ts * 1000), today = new Date();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === today.toDateString() ? time : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
}

function renderContent(keepScroll) {
  const c = $("content");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 60;
  let html = "";
  if (S.view === "session") {
    const list = S.entries.filter(e => matches(e.text));
    if (!S.entries.length && !pendingRow()) {
      html = S.sessionId === S.state.liveSession
        ? `<div class="empty"><h3>Listening…</h3><p>Start talking. Each thing you say appears here a moment after you pause.</p></div>`
        : `<div class="empty"><h3>Empty transcript</h3><p>Nothing was transcribed in this session.</p></div>`;
    } else {
      html = list.map(sessionRow).join("") + (S.query ? "" : pendingRow());
      if (S.query && !list.length) html = `<div class="empty"><p>No matches for “${esc(S.query)}”.</p></div>`;
    }
  } else if (S.view === "dictations") {
    const list = S.dictations.filter(d => matches(d.text));
    html = !S.dictations.length
      ? `<div class="empty"><h3>No dictations yet</h3><p>Hold <kbd>Right ⌥</kbd> in any app, speak, and release.<br>The text is typed where your cursor is, and saved here.</p></div>`
      : list.map(d => `<div class="row"><span class="t">${esc(fmtTime(d.ts))}</span>
          <span class="x">${d.app ? `<span class="app">${esc(d.app)}</span>` : ""}${highlight(d.text)}${d.raw && d.raw !== d.text ? `<span class="raw">Heard: ${esc(d.raw)}</span>` : ""}</span>
          <span class="acts"><button class="icon-btn" title="Copy" data-copy="${esc(d.text)}">${ICON_COPY}</button></span></div>`).join("")
        || `<div class="empty"><p>No matches for “${esc(S.query)}”.</p></div>`;
  } else {
    html = `<div class="log">${S.logs.map(l => `<div class="${/error|fail|denied/i.test(l.msg) ? "err" : ""}"><span class="lt">${esc(l.t)}</span>${esc(l.msg)}</div>`).join("")}</div>`;
  }
  c.innerHTML = html;
  const follow = S.view === "activity" || (S.view === "session" && S.sessionId === S.state.liveSession);
  if (!keepScroll) c.scrollTop = follow ? c.scrollHeight : 0;
  else if (atBottom && follow) c.scrollTop = c.scrollHeight;
}

function render(keepScroll = true) { renderStatus(); renderSidebar(); renderHeader(); renderContent(keepScroll); }

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function selectSession(id) {
  S.touched = true;
  S.view = "session"; S.sessionId = id; S.entries = []; S.query = ""; $("search").value = "";
  post({ cmd: "selectSession", id });
  render(false);
}
function setView(v) { S.touched = true; S.view = v; S.query = ""; $("search").value = ""; render(false); }

// ---------- messages from Python ----------
window.flow = {
  receive(m) {
    switch (m.type) {
      case "state": {
        const prevLive = S.state.liveSession;
        S.state = { ...S.state, ...m };
        if (m.liveSession && m.liveSession !== prevLive) { selectSession(m.liveSession); return; }
        if (!m.continuous) S.speaking = false;
        renderStatus(); renderSidebar(); renderHeader();
        if (S.view === "session") renderContent(true);
        break;
      }
      case "sessions":
        S.sessions = m.sessions;
        if (!S.touched && S.view === "dictations" && S.sessions.length) { S.touched = true; selectSession(S.sessions[0].id); return; }
        renderSidebar(); renderHeader();
        break;
      case "session":
        if (m.id === S.sessionId) { S.entries = m.entries; renderHeader(); renderContent(false); }
        break;
      case "entry": {
        const s = S.sessions.find(x => x.id === m.session);
        if (s) { s.count += 1; renderSidebar(); }
        if (S.view === "session" && S.sessionId === m.session) { S.entries.push(m.entry); renderHeader(); renderContent(true); }
        break;
      }
      case "dictations": S.dictations = m.items; renderSidebar(); if (S.view === "dictations") { renderHeader(); renderContent(false); } break;
      case "dictation":
        S.dictations.unshift(m.item); renderSidebar();
        if (S.view === "dictations") { renderHeader(); renderContent(true); }
        break;
      case "logs": S.logs = m.items; if (S.view === "activity") renderContent(false); break;
      case "log":
        S.logs.push(m); if (S.logs.length > 500) S.logs.shift();
        if (S.view === "activity") renderContent(true);
        break;
      case "level": {
        pushLevel(m.value);
        if (m.speaking !== S.speaking) {
          S.speaking = m.speaking; renderStatus();
          if (S.view === "session") renderContent(true);
        }
        break;
      }
      case "toast": toast(m.msg); break;
    }
  },
};

// ---------- events ----------
$("listenBtn").onclick = () => post({ cmd: "toggleContinuous" });
$("cleanup").onchange = (e) => post({ cmd: "setCleanup", value: e.target.checked });
$("openFolder").onclick = () => post({ cmd: "openFolder" });
document.querySelector("nav").addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) return setView(v.dataset.view);
  const s = e.target.closest("[data-session]"); if (s) selectSession(s.dataset.session);
});
$("content").addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (b) { post({ cmd: "copyText", text: b.dataset.copy }); toast("Copied"); }
});
$("search").addEventListener("input", (e) => { S.query = e.target.value.trim(); renderContent(false); });
$("copyBtn").onclick = () => {
  if (S.view === "session") post({ cmd: "copySession", id: S.sessionId });
  else if (S.view === "dictations") post({ cmd: "copyText", text: S.dictations.slice().reverse().map(d => d.text).join("\n\n") });
  toast("Copied to clipboard");
};
$("revealBtn").onclick = () => post({ cmd: "reveal", id: S.sessionId });
$("exportBtn").onclick = (e) => { e.stopPropagation(); $("exportMenu").classList.toggle("open"); };
$("exportMenu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-format]"); if (!b) return;
  $("exportMenu").classList.remove("open");
  if (S.view === "session") post({ cmd: "export", id: S.sessionId, format: b.dataset.format });
  else post({ cmd: "exportDictations", format: b.dataset.format });
});
document.addEventListener("click", () => $("exportMenu").classList.remove("open"));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("exportMenu").classList.remove("open");
  if ((e.metaKey) && e.key === "f" && S.view !== "activity") { e.preventDefault(); $("search").focus(); }
});

render(false);
post({ cmd: "ready" });
</script>
</body>
</html>
